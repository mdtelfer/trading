[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Rutas donde vive tu código propio (para isort/first-party)
src = ["src", "apps", "scripts"]
exclude = [
  "init/**",
  "tests/data/**",
  "venv/**", ".venv/**",
  "**/__pycache__/**"
]

[tool.ruff.lint]
# Reglas activas (tu set)
select = ["E", "F", "W", "I", "UP", "B", "C90", "SIM"]
# Black ya gestiona el largo de línea; evitamos doble reporte
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
# Si quieres fijar paquetes propios explícitos:
# known-first-party = ["fundamental", "app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ===================== mypy =====================
[tool.mypy]
python_version = "3.11"         # pon "3.12" si tu CI usa 3.12
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
follow_imports = "normal"
show_error_codes = true
pretty = true
files = ["src", "apps", "scripts"]
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

# Overrides equivalentes a tu mypy.ini
[[tool.mypy.overrides]]
module = "fundamental.*"
implicit_reexport = false

[[tool.mypy.overrides]]
module = [
  "MetaTrader5.*", "apscheduler.*", "yfinance.*", "requests.*", "httpx.*",
  "pandas.*", "uvicorn.*", "alembic.*", "psycopg2.*", "ib_insync.*", "nats.*"
]
ignore_missing_imports = true
