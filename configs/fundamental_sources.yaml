    # Liquidez / condiciones financieras
    NFCI: { primary: { source: FRED, series: "NFCI" } } # semanal
    SOFR: { primary: { source: FRED, series: "SOFR" } } # overnight
    ON_RRP: { primary: { source: FRED, series: "RRPONTSYD" } } # ON RRP total

    # Crédito
    DBAA: { primary: { source: FRED, series: "DBAA" } } # Moody's BAA yield
    DAAA: { primary: { source: FRED, series: "DAAA" } } # Moody's AAA yield

    # Commodities / ciclo
    COPPER: { primary: { source: YahooFinance, symbol: "HG=F" } }
