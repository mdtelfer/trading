      primary: { source: YahooFinance, symbol: "^GVZ" }
    OVX:
      primary: { source: YahooFinance, symbol: "^OVX" }
    VXN:
      primary: { source: YahooFinance, symbol: "^VXN" }
    SKEW:
      primary: { source: YahooFinance, symbol: "^SKEW" }

    # Curva / inflación
    UST2Y: { primary: { source: FRED, series: "DGS2" } }
    UST30Y: { primary: { source: FRED, series: "DGS30" } }
    T10YIE: { primary: { source: FRED, series: "T10YIE" } } # 10y breakeven
